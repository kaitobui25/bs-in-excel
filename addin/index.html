<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="X-UA-Compatible" content="IE=Edge"/>
  <title>Text Browser · Excel</title>
  <link rel="stylesheet" href="/style.css"/>
  <script src="https://officeapis.public.onecdn.static.microsoft/1/office.js"></script>
  <script defer src="/app.js"></script>
</head>
<body>
  <main id="app">
    <div class="reader-menu" role="toolbar" aria-label="Công cụ đọc trang">
      <button type="button" id="nav-toggle" aria-label="Thanh địa chỉ" aria-controls="navigation-bar" aria-expanded="false" title="Thanh địa chỉ">☰</button>
      <button type="button" id="scroll-top" title="Về đầu trang" aria-label="Về đầu trang">↑ Đầu trang</button>
      <span class="menu-spacer"></span>
      <span class="translate-label">Dịch:</span>
      <button type="button" id="translate-original" title="Hiện văn bản gốc" aria-pressed="true">Gốc</button>
      <button type="button" id="translate-en" title="Dịch sang tiếng Anh" aria-pressed="false">EN</button>
      <button type="button" id="translate-vi" title="Dịch sang tiếng Việt" aria-pressed="false">VI</button>
      <span id="translate-status" role="status" aria-live="polite" title=""></span>
    </div>
    <header id="navigation-bar" class="toolbar">
      <nav class="nav" aria-label="Navigation">
        <button id="back" title="Quay lại" aria-label="Quay lại">←</button>
        <button id="forward" title="Tiến tới" aria-label="Tiến tới">→</button>
        <button id="reload" title="Tải lại" aria-label="Tải lại">↻</button>
      </nav>
      <form id="address-form" autocomplete="off">
        <input id="address" type="text" aria-label="Địa chỉ hoặc từ khóa" placeholder="Nhập URL hoặc tìm Google…" spellcheck="false"/>
        <button id="go" type="submit">Đi</button>
      </form>
      <button id="history" title="Lịch sử" aria-label="Lịch sử">Lịch sử</button>
    </header>
    <div id="status" class="sr-only" role="status" aria-live="polite">Sẵn sàng</div>
    <article id="viewport">
      <div id="welcome">
        <h2>Duyệt web ngay trong Excel</h2>
        <p>Nhập một địa chỉ hoặc từ khóa vào thanh trên. Nội dung trang và kết quả tìm kiếm xuất hiện tại đây.</p>
        <p class="examples"><button type="button" id="sample-siemens">Siemens TIA Portal</button> <button type="button" id="sample-facebook">Facebook</button> <button type="button" id="sample-google">Tìm: siemens tia portal</button></p>
      </div>
      <h1 id="title" hidden></h1>
      <p id="page-notice" class="page-notice" hidden></p>
      <div id="content" hidden></div>
      <button type="button" id="load-more" hidden>Tải thêm bài viết</button>
      <div id="links" hidden></div>
      <div id="history-list" hidden></div>
    </article>
  </main>
</body>
</html>
